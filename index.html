<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Dozen</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #efefef;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 30px;
        margin-top: 35px;
      }

      .row {
        display: flex;
        gap: 30px;
      }

      .row-reverse {
        flex-direction: row-reverse;
      }

      .block {
        width: 200px;
        height: 200px;
      }

      .blue { background: #0f40d8; }
      .black { background: #000000; }
      .red { background: #ff1c1c; }
      .green { background: #0f8d3b; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="block blue"></div>
        <div class="block black"></div>
        <div class="block red"></div>
        <div class="block green"></div>
      </div>

      <div class="row row-reverse">
        <div class="block blue"></div>
        <div class="block black"></div>
        <div class="block red"></div>
        <div class="block green"></div>
      </div>
    </div>
  </body>
</html>
